name: macOS Apple Silicon

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build DMG
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install build dependencies
        run: |
          python -m pip install '.[dev,face]'
          python -c 'from pickupphoto.analysis.face_focus import is_available; assert is_available()'
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(python -c 'from pickupphoto import __version__; print(__version__)')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Run tests
        run: |
          python -m pytest -q
          node --check pickupphoto/web/static/app.js
      - name: Build and verify DMG
        env:
          PYTHON_BIN: python
          DMG_OUTPUT_DIR: dist/release
        run: ./build_dmg.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PickUpPhoto-macOS-arm64
          if-no-files-found: error
          path: dist/release/*

  release:
    name: Publish version to GitHub Releases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PickUpPhoto-macOS-arm64
          path: release
      - name: Verify and publish release assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          dmg="PickUpPhoto_${GITHUB_REF_NAME}_AppleSilicon.dmg"
          sha256sum --check "$dmg.sha256"
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "PickUpPhoto $GITHUB_REF_NAME"
