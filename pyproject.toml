[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pickupphoto"
dynamic = ["version"]
description = "輕量 RAW 照片瀏覽、評分與輸出工具（NEF / RAF）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "rawpy>=0.19",
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "imagehash>=4.3",
    "piexif>=1.1",
    "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=11; sys_platform == 'darwin'",
]

[project.optional-dependencies]
legacy = ["dearpygui>=1.11"]
face = [
    "mediapipe==0.10.21",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pyinstaller>=6.0",
]

[project.scripts]
pickupphoto = "pickupphoto.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "pickupphoto.__version__"}

[tool.setuptools.package-data]
"pickupphoto.web" = ["static/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pickupphoto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
